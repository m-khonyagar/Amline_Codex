name: Python CI

on:
  push:
    branches: [main]
    paths:
      - 'services/agent/**'
      - 'apps/namAvaran/backend/**'
      - 'apps/namAvaran/pdf-generator/**'
      - 'apps/namAvaran/super-agent/**'
      - 'apps/namAvaran/agents/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/agent/**'
      - 'apps/namAvaran/backend/**'
      - 'apps/namAvaran/pdf-generator/**'
      - 'apps/namAvaran/super-agent/**'
      - 'apps/namAvaran/agents/**'

jobs:
  agent-service:
    name: Agent Service (services/agent)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          OPENAI_API_KEY: skip
          WORKSPACE_ROOT: /tmp/workspace
        run: pytest -q --tb=short

  backend:
    name: Backend API (apps/namAvaran/backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/namAvaran/backend/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/namAvaran/backend/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (if present)
        run: |
          if [ -f pytest.ini ] || [ -d tests ]; then
            pytest -q --tb=short || true
          else
            echo "No tests found — skipping"
          fi
