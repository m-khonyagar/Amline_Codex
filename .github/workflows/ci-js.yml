name: JS/TS CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/namAvaran/admin-ui/**'
      - 'apps/namAvaran/amline-ui/**'
      - 'apps/namAvaran/channel-gateway/**'
      - 'apps/saas-mvp/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/namAvaran/admin-ui/**'
      - 'apps/namAvaran/amline-ui/**'
      - 'apps/namAvaran/channel-gateway/**'
      - 'apps/saas-mvp/**'

jobs:
  admin-ui:
    name: Admin UI (apps/namAvaran/admin-ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/namAvaran/admin-ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/namAvaran/admin-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test --if-present

      - name: Build
        env:
          VITE_API_URL: ''
          VITE_USE_MSW: 'true'
          VITE_ENABLE_DEV_BYPASS: 'false'
        run: npm run build

  channel-gateway:
    name: Channel Gateway (apps/namAvaran/channel-gateway)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/namAvaran/channel-gateway

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/namAvaran/channel-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

  saas-mvp:
    name: SaaS MVP (apps/saas-mvp)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/saas-mvp

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/saas-mvp/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck 2>/dev/null || true
